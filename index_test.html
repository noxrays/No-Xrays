<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="Assets/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Homepage</title>

    <script>
        // Function to load an image asynchronously
        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = url;
            });
        }

        // Function to load external HTML content
        function loadExternalHtml() {
            fetch('navbar.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load content');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar').innerHTML = data;
                    return Promise.all([
                        loadImage('https://www.dropbox.com/scl/fi/zu7pwaisjnorofbic6wl0/Europe_Button.jpg?rlkey=b2unj4b4rp9b7cjpz63m16k1i&st=k1m75aq8&raw=1'),
                        loadImage('https://www.dropbox.com/scl/fi/fc1fnp46zvmkspk71556h/Japan.jpg?rlkey=lxe2tpbtj8xv54pwptxunwu4o&st=5abi7wn9&raw=1'),
                        loadImage('https://www.dropbox.com/scl/fi/5d97qqph5362eq89x1ozn/Experimental.jpg?rlkey=00je48jjucfz00kr97tjqpib6&st=8x8zsgik&raw=1')
                    ]);
                })
                .then(images => {
                    // Images are loaded, now we can append them to the DOM
                    const imageGrid = document.querySelector('.image-grid');
                    ['Europe', 'Japan', 'Experimental'].forEach((title, index) => {
                        const link = document.createElement('a');
                        link.href = `https://www.noxrays.photography/${title}`;
                        link.className = 'image-link';
                        
                        const img = images[index];
                        img.alt = title;

                        const overlay = document.createElement('div');
                        overlay.className = 'overlay';

                        link.appendChild(img);
                        link.appendChild(overlay);
                        imageGrid.appendChild(link);
                    });
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function showSidebar() {
            document.querySelector('.sidebar').style.display = 'flex';
        }

        function hideSidebar() {
            document.querySelector('.sidebar').style.display = 'none';
        }

        // Call the function to load content before body
        document.addEventListener('DOMContentLoaded', loadExternalHtml);
    </script>
</head>

<body>
    <div id="navbar"></div>
    <div class="content-container">
        <div class="image-grid"></div>
    </div>
</body>
</html>
