<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script>
        // Function to load external HTML content
        function loadExternalHtml() {
            fetch('navbar.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load content');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar').innerHTML = data;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        // Call the function to load content before body
        document.addEventListener('DOMContentLoaded', loadExternalHtml);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Padauk', sans-serif;
            min-height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Navbar styles */
        nav {
            background-color: white;
            z-index: 1000;
        }

        nav ul {
            width: 100%;
            list-style: none;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        nav li {
            height: 50px;
        }

        nav a {
            height: 100%;
            padding: 0 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            color: black;
        }

        nav a:hover {
            background-color: #f0f0f0;
        }

        nav li:first-child {
            margin-right: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            box-shadow: -10px 0 10px rgba(0, 0, 0, 0.1);
            list-style: none;
            display: none;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1001;
        }

        .sidebar li {
            width: 250px;
        }

        .sidebar a {
            width: 250px;
            overflow: hidden;
        }

        .menu-button {
            display: none;
            margin-left: 10px;
        }

        .dropdown {
            height: 100%;
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #ddd;
            color: black;
        }

        /* Content styles */
        .content-container {
            width: 80%;
            margin: 0 auto;
            padding-top: 20px;
        }

        .image-grid {
            display: grid;
            gap: 15px;
            justify-content: center;
        }

        .horizontal-image-grid {
            grid-template-columns: repeat(2, 1fr);
            margin-bottom: 30px;
        }

        .vertical-image-grid {
            grid-template-columns: repeat(3, 1fr);
            margin-top: 15px;
            margin-bottom: 15px;

        }

        .image-item {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .horizontal-image-item {
            padding-top: 75%;
        }

        .vertical-image-item {
            padding-top: 133.33%;
        }

        .image-item img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
        }

        .modal-content {
            position: relative;
            margin-top: 2%;
            text-align: center;
        }

        .modal img {
            display: block;
            margin: auto;
            padding: 2%;
            background-color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .dots {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        .dot {
            height: 10px;
            width: 10px;
            margin: 0 5px;
            background-color: #bbb;
            border-radius: 50%;
            cursor: pointer;
            transition: background-color 0.6s ease;
        }

        .dot.active {
            background-color: #717171;
        }

        .close-btn, .arrow {
            position: absolute;
            top: 50%;
            color: #fff;
            font-size: 30px;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .close-btn {
            top: 10px;
            right: 10px;
            font-size: 20px;
            transform: none;
        }

        .arrow {
            font-size: 40px;
        }

        .arrow-left {
            left: 10px;
        }

        .arrow-right {
            right: 10px;
        }

        /* Media Queries */
        @media (max-width: 800px) {
            .menu-button {
                display: block;
                margin-left: 10px;
                order: 1;
            }

            .title {
                margin-left: auto;
                order: 2;
            }

            ul {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            .hideOnMobile {
                display: none;
            }

            .horizontal-image-grid {
                grid-template-columns: repeat(1, 1fr);
                margin-bottom: 30px;
            }

            .vertical-image-grid {
                grid-template-columns: repeat(1, 1fr);
                margin-top: 15px;
            }

            /* Disable cursor pointer on mobile to indicate non-interactivity */
            .image-item img {
                cursor: default;
            }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <div class="content-container">
        <div class="image-grid vertical-image-grid" id="vertical-image-grid">
            <!-- Vertical images will be added here by the script -->
        </div>

        <div class="image-grid horizontal-image-grid" id="horizontal-image-grid">
            <!-- Horizontal images will be added here by the script -->
        </div>

        <div id="myModal" class="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">×</span>
                <img id="modalImg" src="" alt="Modal Image" onclick="navigateImage(1)">
                <span class="arrow arrow-left" onclick="navigateImage(-1)">❮</span>
                <span class="arrow arrow-right" onclick="navigateImage(1)">❯</span>
            </div>
            <div class="dots" id="dots-container"></div>
        </div>
    </div>

    <script>
        function showSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = sidebar.style.display === 'flex' ? 'none' : 'flex';
            sidebar.style.width = '250px';
        }

        function hideSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = 'none';
        }

        let currentImageIndex = 0;
        const imageUrls = [
            'https://www.dropbox.com/scl/fi/ud55hacem9jykv49uhcj6/000090960011-1.jpg?rlkey=1vuhr4ztsi1bq5qqq5wvfa5p8&st=n6gzu6bs&raw=1',
            'https://www.dropbox.com/scl/fi/q1joni93kx4s5avoihoch/000090960027-1.jpg?rlkey=q7snewt1k7l3baax6odvp8nej&st=nxb0t65o&raw=1',
            'https://www.dropbox.com/scl/fi/a01akfcyc767eqridrul1/000090960003-1.jpg?rlkey=j8m9hrvx8ydk9wwwneag923pw&st=mu3i0joe&raw=1',
            'https://www.dropbox.com/scl/fi/vzg8i3p9x4ptkvhcczn6q/000090960008-1.jpg?rlkey=fn8ncancga6uqj6rh44gezxph&st=k1lipjpd&raw=1',
            'https://www.dropbox.com/scl/fi/62z3f4xhufbfsg83gx6ah/000090960025-1.jpg?rlkey=ft8l8bvirq4ioi2w4qsogm25d&st=6dut0wbs&raw=1',
            'https://www.dropbox.com/scl/fi/8sw969t331361vhku9j9p/000090960030-1.jpg?rlkey=o2xx90eocjc9mu6jfbppchtqv&st=cgie3a08&raw=1',
            'https://www.dropbox.com/scl/fi/80r4x2gr4cjza7f3iho9h/000090960024-1.jpg?rlkey=8lznj28fzgx4liv8nssrrajez&st=qxgtbch3&raw=1',
            'https://www.dropbox.com/scl/fi/c5sqx3y20xwckg7bywu3g/000090960033-1.jpg?rlkey=1cwwyp6r452j8fct1fu8waiff&st=jy77opkq&raw=1',
        ];

        async function checkImageOrientation(url) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.src = url;
                img.onload = () => {
                    const isHorizontal = img.naturalWidth >= img.naturalHeight;
                    resolve(isHorizontal);
                };
                img.onerror = reject;
            });
        }

        async function createImageElements() {
            const horizontalImageGrid = document.getElementById('horizontal-image-grid');
            const verticalImageGrid = document.getElementById('vertical-image-grid');
            horizontalImageGrid.innerHTML = '';
            verticalImageGrid.innerHTML = '';

            const fragmentHorizontal = document.createDocumentFragment();
            const fragmentVertical = document.createDocumentFragment();

            // Check image orientations
            const orientationChecks = imageUrls.map(url => checkImageOrientation(url));
            const orientations = await Promise.all(orientationChecks);

            // Check if the device is mobile (screen width <= 800px)
            const isMobile = window.matchMedia("(max-width: 800px)").matches;

            // Create image elements
            for (let i = 0; i < imageUrls.length; i++) {
                const url = imageUrls[i];
                const isHorizontal = orientations[i];

                const div = document.createElement('div');
                div.className = 'image-item';

                // Only add the onclick event if not on a mobile device
                if (!isMobile) {
                    div.onclick = () => openModal(url);
                }

                const img = document.createElement('img');
                img.src = url;
                img.alt = `Image ${i + 1}`;

                div.appendChild(img);

                if (isHorizontal) {
                    div.className += ' horizontal-image-item';
                    fragmentHorizontal.appendChild(div);
                } else {
                    div.className += ' vertical-image-item';
                    fragmentVertical.appendChild(div);
                }
            }

            horizontalImageGrid.appendChild(fragmentHorizontal);
            verticalImageGrid.appendChild(fragmentVertical);

            // Center the last row if it's not full
            const horizontalRemainder = orientations.filter(isHorizontal => isHorizontal).length % 2;
            const verticalRemainder = orientations.filter(isHorizontal => !isHorizontal).length % 3;

            if (horizontalRemainder !== 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'image-item';
                emptyDiv.style.visibility = 'hidden';
                horizontalImageGrid.appendChild(emptyDiv);
            }

            if (verticalRemainder !== 0) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'image-item';
                emptyDiv.style.visibility = 'hidden';
                verticalImageGrid.appendChild(emptyDiv);
            }
        }

        function openModal(imageUrl) {
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imageUrl;
            modalImg.onload = () => {
                adjustImageSize(modalImg);
            };
            document.getElementById('myModal').style.display = 'block';
            currentImageIndex = imageUrls.indexOf(imageUrl);
            document.addEventListener('keydown', handleKeyPress);
            document.addEventListener('click', handleClickOutside);
            updateDots();
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
            document.removeEventListener('keydown', handleKeyPress);
            document.removeEventListener('click', handleClickOutside);
        }

        function handleKeyPress(event) {
            if (event.key === 'Escape') {
                closeModal();
            } else if (event.key === 'ArrowLeft') {
                navigateImage(-1);
            } else if (event.key === 'ArrowRight') {
                navigateImage(1);
            }
        }

        function handleClickOutside(event) {
            const modal = document.getElementById('myModal');
            if (event.target === modal) {
                closeModal();
            }
        }

        function navigateImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex < 0) {
                currentImageIndex = imageUrls.length - 1;
            } else if (currentImageIndex >= imageUrls.length) {
                currentImageIndex = 0;
            }
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imageUrls[currentImageIndex];
            modalImg.onload = () => {
                adjustImageSize(modalImg);
            };
            updateDots();
        }

        function updateDots() {
            const dotsContainer = document.getElementById('dots-container');
            dotsContainer.innerHTML = '';

            for (let i = 0; i < imageUrls.length; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                if (i === currentImageIndex) {
                    dot.classList.add('active');
                }
                dot.onclick = function () {
                    currentImageIndex = i;
                    const modalImg = document.getElementById('modalImg');
                    modalImg.src = imageUrls[currentImageIndex];
                    modalImg.onload = () => {
                        adjustImageSize(modalImg);
                    };
                    updateDots();
                };
                dotsContainer.appendChild(dot);
            }
        }

        function adjustImageSize(img) {
            const maxWidth = window.innerWidth * 0.85;
            const maxHeight = window.innerHeight * 0.85;
            const widthRatio = maxWidth / img.naturalWidth;
            const heightRatio = maxHeight / img.naturalHeight;

            let scale;
            const isVertical = img.naturalHeight > img.naturalWidth;

            if (isVertical) {
                scale = Math.min(widthRatio, heightRatio);
            } else {
                scale = Math.min(widthRatio, heightRatio);
            }

            img.style.width = img.naturalWidth * scale + 'px';
            img.style.height = img.naturalHeight * scale + 'px';
        }

        createImageElements();
    </script>
</body>
</html>
