<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="Assets/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Homepage</title>

    <script>
        function loadExternalHtml() {
            fetch('navbar.html')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load content');
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('navbar').innerHTML = data;
                })
                .catch(error => {
                    console.error('Error:', error);
                });
        }

        function showSidebar() {
            document.querySelector('.sidebar').style.display = 'flex';
        }

        function hideSidebar() {
            document.querySelector('.sidebar').style.display = 'none';
        }

        document.addEventListener('DOMContentLoaded', loadExternalHtml);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');

        /* Navbar styles */
        nav {
            background-color: white;
            z-index: 1000;
        }

        nav ul {
            width: 100%;
            list-style: none;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        nav li {
            height: 50px;
        }

        nav a {
            height: 100%;
            padding: 0 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            color: black;
        }

        nav a:hover {
            background-color: #f0f0f0;
        }

        nav li:first-child {
            margin-right: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            box-shadow: -10px 0 10px rgba(0, 0, 0, 0.1);
            list-style: none;
            display: none;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1001;
        }

        .sidebar li {
            width: 250px;
        }

        .sidebar a {
            width: 250px;
            overflow: hidden;
        }

        .menu-button {
            display: none;
            margin-left: 10px;
        }

        .dropdown {
            height: 100%;
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #ddd;
            color: black;
        }


        body {
            font-family: 'Padauk', sans-serif;
            margin: 0;
            padding: 0;
        }

        .content-container {
            width: 80%;
            max-width: 100%;
            margin: 0 auto;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .image-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(100px, 1fr));
            gap: 15px;
            padding: 20px;
            max-width: 90vw;
            margin: auto;
            justify-content: center;
            box-sizing: border-box;
        }

        .image-link {
            display: block;
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 16px;
        }

        .image-link img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 128, 128, 0.7);
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 1;
        }

        .image-link:hover .overlay {
            opacity: 1;
        }

        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Padauk', sans-serif;
            font-size: 72px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 2;
            pointer-events: none;
        }

        @media(max-width: 800px) {
            .image-grid {
                grid-template-columns: repeat(1, minmax(100%, 1fr));
                max-width: 600px;
            }
        }

        @media(max-width: 1200px) {
            .image-grid {
                grid-template-columns: repeat(1, minmax(100%, 1fr));
                max-width: 600px;
                z-index: 1;
            }
        }
    </style>
</head>

<body>
    <div id="navbar"></div>

    <div class="content-container">
        <div class="image-grid">
            <a href="/Europe" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/zu7pwaisjnorofbic6wl0/Europe_Button.jpg?rlkey=b2unj4b4rp9b7cjpz63m16k1i&st=nnvwf4yg&raw=1" alt="Europe">
                <div class="overlay"></div>
            </a>

            <a href="/Japan" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/fc1fnp46zvmkspk71556h/Japan.jpg?rlkey=lxe2tpbtj8xv54pwptxunwu4o&st=sdns7131&raw=1" alt="Japan">
                <div class="overlay"></div>
            </a>

            <a href="/Experimental" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/5d97qqph5362eq89x1ozn/Experimental.jpg?rlkey=00je48jjucfz00kr97tjqpib6&st=q5iunqb3&raw=1" alt="Experimental">
                <div class="overlay"></div>
            </a>

            <a href="/southkorea" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/szg5bua4puroywh21arf2/SouthKorea_button.jpg?rlkey=pnlha0clcngewst8r6p2r06yf&st=0rqvcavu&raw=1" alt="South Korea">
                <div class="overlay"></div>
            </a>

            <a href="/chicago" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/xue74u2cihmho6j2hsl25/chicago_button_small.jpg?rlkey=6xsysvjeo4p4uxnxta2e2ouus&st=aaqe6yca&raw=1" alt="Chicago">
                <div class="overlay"></div>
            </a>

            <a href="/hawaii" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/n02mdf30qdmhbu7p6xmdr/Hawaii_Button_Small.jpg?rlkey=j2saqevjk0meo0yghlih59xjp&st=kd6iuk8x&raw=1" alt="Hawaii">
                <div class="overlay"></div>
            </a>

            <a href="/colorado" class="image-link">
                <img src="https://www.dropbox.com/scl/fi/tnypgvxhi41nbjm29xlpx/colorado_button_small.jpg?rlkey=62jfmq84bnsy0jbotupb4nyme&st=utti2eg8&raw=1" alt="Colorado">
                <div class="overlay"></div>

            <a href="/arkansas" class="image-link">
                <img src="https://res.cloudinary.com/dghco8e5t/image/upload/f_auto,q_auto/v1767842709/Arkansas_button_nklp9l.jpg" alt="Arkansas">
                <div class="overlay"></div>    
           </a>
        </div>
    </div>
</body>
</html>
