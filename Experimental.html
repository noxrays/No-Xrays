<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="modal.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@700&display=swap');
        .content-container {
            width: 80%;
            margin: 0 auto;
            padding-top: 20px;
        }
        body {
            min-height: 100vh;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            font-family: 'Padauk', sans-serif;
/*             overflow: hidden;
 */        }

         /* Navbar styles */
         nav {
            background-color: white;
            z-index: 1000;
        }

        nav ul {
            width: 100%;
            list-style: none;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0;
            margin: 0;
        }

        nav li {
            height: 50px;
        }

        nav a {
            height: 100%;
            padding: 0 30px;
            text-decoration: none;
            display: flex;
            align-items: center;
            color: black;
        }

        nav a:hover {
            background-color: #f0f0f0;
        }

        nav li:first-child {
            margin-right: auto;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 250px;
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(12px);
            box-shadow: -10px 0 10px rgba(0, 0, 0, 0.1);
            list-style: none;
            display: none;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
            z-index: 1001;
        }

        .sidebar li {
            width: 250px;
        }

        .sidebar a {
            width: 250px;
            overflow: hidden;
        }

        .menu-button {
            display: none;
            margin-left: 10px;
        }

        .dropdown {
            height: 100%;
            position: relative;
            display: inline-block;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 2;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            text-align: left;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropbtn {
            background-color: #ddd;
            color: black;
        }
    </style>
</head>

<body>
    <div id="navbar"></div>
    <div class="content-container" id="main-content">
        <div id="urban-decay"></div><hr>
        <div id="light-leaks"></div><hr>
        <div id="film-soup"></div><hr>
    </div>

    <!-- Modal structure -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <img id="modalImg" src="" alt="Modal Image" onclick="navigateImage(1)">
            <span class="arrow arrow-left" onclick="navigateImage(-1)">&#10094;</span>
            <span class="arrow arrow-right" onclick="navigateImage(1)">&#10095;</span>
        </div>
        <div class="dots" id="dots-container"></div>
    </div>

    <!-- Load modal.js first -->
    <script src="modal.js"></script>
    <script src="navbar.js"></script>

    <!-- Main page's script -->
    <script>
        function loadExternalHtml() {
            fetch('navbar.html')
                .then(response => response.text())
                .then(data => document.getElementById('navbar').innerHTML = data)
                .catch(error => console.error('Error loading navbar:', error));
        }

        function loadContent(file, elementId) {
            return fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load content');
                    return response.text();
                })
                .then(data => {
                    const element = document.getElementById(elementId);
                    if (!element) throw new Error(`Element with id "${elementId}" not found`);
                    element.innerHTML = data;

                    // Dynamically load and execute the corresponding JS file
                    const script = document.createElement('script');
                    script.src = file.replace('.html', '.js');
                    document.body.appendChild(script);

                    return new Promise((resolve, reject) => {
                        script.onload = resolve; // Wait until the script is fully loaded
                        script.onerror = reject;
                    });
                })
                .catch(error => console.error('Error loading content:', error));
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadExternalHtml();

            loadContent('urban-decay2.html', 'urban-decay').then(() => {
                // 'gatherImages()' is called within 'urban-decay2.js' after images are loaded
                console.log('Urban Decay content loaded.');

                
                loadContent('light-leaks.html', 'light-leaks').then(() => {
                // 'gatherImages()' is called within 'urban-decay2.js' after images are loaded
                console.log('Light Leaks content loaded.');
            }).then(() => {
                return loadContent('film-soup.html', 'film-soup');  // Fixed filename typo
            }).then(() => {
                // 'gatherImages()' is called within 'film-soup.js' after images are loaded
                console.log('Film Soup content loaded.');
            });  // Updated log message to match the file being loaded
            }).catch(error => {
                console.error('Error loading content:', error);
            });
});

    </script>

</body>
</html>
